# The public mTLS ingress is a dedicated non-login principal. Its only broker
# membership is the shared socket-access group; broker ACLs independently
# restrict it to infrastructure verification-context plus ingest.
u devcoord-infra-ingress - "DevCoordinator infrastructure ingress" /var/lib/devcoordinator-infrastructure-ingress /usr/sbin/nologin
m devcoord-infra-ingress devcoordinator-clients
