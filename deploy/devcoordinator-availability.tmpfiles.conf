# Immutable release and credential/configuration parents.  Secret files and
# route publications are installed separately with exact content and mode.
d /opt/devcoordinator 0755 root root -
d /opt/devcoordinator/releases 0755 root root -
d /opt/devcoordinator-browser-runtimes 0755 root root -
# Client profiles and retained inventory are non-secret, root/service-published
# data.  Local developer accounts may read them without session group refresh;
# credential subdirectories and databases remain private below these parents.
d /etc/devcoordinator 0755 root root -
d /etc/devcoordinator/edge 0700 root root -
d /etc/devcoordinator/console-slots 0755 root root -
# Profiles and retained inventory are non-secret local coordination data. The
# z entries repair existing installations without creating empty documents.
z /etc/devcoordinator/client-profiles.json 0644 root root -
# Byte-identical non-secret projection of the private sealed browser runtime
# inventory, published by the release switch for actual-caller Playwright QA.
z /etc/devcoordinator/browser-runtime-lock.json 0644 root root -
d /run/devcoordinator 0755 root root -
d /run/devcoordinator-maintenance 0755 root root -
d /var/lib/devcoordinator 0711 root root -
d /var/lib/devcoordinator-browser-lifecycle 0755 root root -
d /var/lib/devcoordinator/browser 0700 root root -
# Open Coordinator bugs are bounded non-secret coordination metadata.  The
# project security assumptions confirm one trusted developer across local
# accounts, so every account and blue/green Console instance shares the same
# open-only directory without UID/GID/mode authorization gates.
d /var/lib/devcoordinator-bugs 0777 root root -
d /var/lib/devcoordinator-bugs/open 0777 root root -
# Delivery-efficiency snapshots are bounded non-secret aggregate telemetry.
# Each trusted local account owns its replaceable repository snapshots while
# Console instances read the complete cross-account projection.
d /var/lib/devcoordinator-efficiency 0777 root root -
d /var/lib/devcoordinator-efficiency/accounts 0777 root root -
d /var/lib/devcoordinator-edge 0700 devcoordinator-edge devcoordinator-edge -
d /var/lib/devcoordinator-console 0700 devcoordinator-console devcoordinator-console -
d /var/lib/devcoordinator-observer 0755 devcoordinator-observer devcoordinator-observer -
z /var/lib/devcoordinator-observer/inventory.publication 0644 devcoordinator-observer devcoordinator-observer -
# Browser lifecycle observations are non-secret operator telemetry. The root
# authority remains the only writer; local accounts receive read-only status.
z /var/lib/devcoordinator-browser-lifecycle/browser-lifecycle.json 0644 root root -
z /var/lib/devcoordinator-browser-lifecycle/browser-lifecycle.json.lock 0644 root root -
d /var/lib/devcoordinator-testd 0700 devcoordinator-testd devcoordinator-testd -
d /var/lib/devcoordinator-notifications 0700 devcoordinator-notifications devcoordinator-notifications -
d /run/devcoordinator-notifications 0755 devcoordinator-notifications devcoordinator-notifications -
d /var/lib/devcoordinator-test-snapshots 0711 root root -
d /var/lib/devcoordinator-test-snapshot-catalog 0700 root root -
# Non-secret per-attempt children remain owner-private. The shared root needs
# traverse-only access so attributed repository-UID runners can publish their
# durable result across control-plane and snapshot-authority replacement.
d /var/lib/devcoordinator-test-runs 0711 root root -
d /var/lib/devcoordinator-test-results 0750 root devcoordinator-testd -
d /var/lib/devcoordinator-test-fixtures 0700 root root -
d /var/lib/devcoordinator-test-adoption 0700 root root -
d /run/devcoordinator/test-fixture-credentials 0700 root root -
d /run/devcoordinator-test-snapshotd 0755 root root -
