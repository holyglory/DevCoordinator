# Dedicated service identities give systemd independent cgroup, process and
# restart boundaries. Local IPC is trusted server-wide and does not use shared
# groups or supplementary memberships as an authorization mechanism.
u devcoordinator-edge - "DevCoordinator public edge" /nonexistent /usr/sbin/nologin
u devcoordinator-console - "DevCoordinator Console" /nonexistent /usr/sbin/nologin
u devcoordinator-api - "DevCoordinator loopback API" /nonexistent /usr/sbin/nologin
u devcoordinator-observer - "DevCoordinator host observer" /nonexistent /usr/sbin/nologin
u devcoordinator-testd - "DevCoordinator test scheduler" /nonexistent /usr/sbin/nologin
u devcoordinator-notifications - "DevCoordinator Telegram notifications" /nonexistent /usr/sbin/nologin
